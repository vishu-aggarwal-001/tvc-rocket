; SkyCrawler robot brain — ESP32-S3 (SuperMini / DevKitC-1)
; Build & flash:  pio run -t upload      Serial monitor:  pio device monitor
[env:skycrawler]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728
board_build.partitions = huge_app.csv   ; 3 MB app, fits the 4 MB SuperMini
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  madhephaestus/ESP32Servo@^3.0.5
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.2.0
